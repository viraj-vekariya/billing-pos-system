<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Billing POS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="topnav">
        <span class="brand">Counter POS</span>
        <a href="{{ url_for('new_sale') }}">New Sale</a>
        <a href="{{ url_for('products') }}">Products</a>
        <a href="{{ url_for('history') }}">Sales History</a>
        <a href="{{ url_for('reports') }}">Reports</a>
    </nav>
    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for m in messages %}<p>{{ m }}</p>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
