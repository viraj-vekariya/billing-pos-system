{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
    <h1>Edit product</h1>
    <form method="post" class="form">
        <label>Name<input type="text" name="name" value="{{ product.name }}" required></label>
        <label>SKU<input type="text" value="{{ product.sku }}" disabled></label>
        <label>Unit price<input type="number" step="0.01" min="0" name="unit_price" value="{{ product.unit_price }}" required></label>
        <label>Tax rate %<input type="number" step="0.01" min="0" name="tax_rate_percent" value="{{ product.tax_rate_percent }}" required></label>
        <label>Stock quantity<input type="number" min="0" name="stock_quantity" value="{{ product.stock_quantity }}" required></label>
        <button type="submit" class="btn">Save changes</button>
    </form>
{% endblock %}
