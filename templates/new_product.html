{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
    <h1>Add product</h1>
    <form method="post" class="form">
        <label>Name<input type="text" name="name" required></label>
        <label>SKU<input type="text" name="sku" required></label>
        <label>Unit price<input type="number" step="0.01" min="0" name="unit_price" required></label>
        <label>Tax rate %<input type="number" step="0.01" min="0" name="tax_rate_percent" value="0" required></label>
        <label>Stock quantity<input type="number" min="0" name="stock_quantity" value="0" required></label>
        <button type="submit" class="btn">Save product</button>
    </form>
{% endblock %}
